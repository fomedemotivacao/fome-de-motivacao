name: Publicar Post Automático

on:
  # Executa toda segunda e quinta às 08:00 (horário de Brasília = 11:00 UTC)
  schedule:
    - cron: '0 11 * * 1,4'

  # Permite disparar manualmente pelo GitHub Actions UI
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema do artigo (deixe vazio para usar rotação automática)'
        required: false
        default: ''
      angulo:
        description: 'Ângulo editorial (opcional)'
        required: false
        default: ''
      sensacao:
        description: 'Reflexão que o leitor deve levar (opcional)'
        required: false
        default: ''
      palavra_chave:
        description: 'Palavra-chave SEO (opcional)'
        required: false
        default: ''

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar post com OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_TEMA: ${{ github.event.inputs.tema }}
          POST_ANGULO: ${{ github.event.inputs.angulo }}
          POST_SENSACAO: ${{ github.event.inputs.sensacao }}
          POST_PALAVRA_CHAVE: ${{ github.event.inputs.palavra_chave }}
        run: node scripts/generate-post.mjs

      - name: Configurar Git
        run: |
          git config user.name "Fome de Motivação Bot"
          git config user.email "bot@fomedemotivacao.com.br"

      - name: Commit e push do novo post
        run: |
          git add src/data/posts.ts
          git diff --staged --quiet || git commit -m "feat(posts): adiciona novo artigo automático [skip ci]"
          git push

      - name: Resumo do post publicado
        run: |
          echo "✅ Post publicado com sucesso!"
          echo "📅 Data: $(date '+%d/%m/%Y %H:%M')"
          git log -1 --format='%s'
