name: 🗨️🖴 Generate Post Images (OpenRouter + Unsplash)

on:
  push:
    branches: [main]
    paths:
      - 'src/data/posts.ts'

  workflow_dispatch:
    inputs:
      force_all:
        description: 'Regenerar TODAS as imagens (mesmo as já existentes)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      specific_slug:
        description: 'Slug específico do post (deixe em branco para todos)'
        required: false
        default: ''

jobs:
  generate-images:
    name: Generate Queries (OpenRouter) + Fetch Images (Unsplash)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependências do script
        run: npm install node-fetch@3 --no-save

      - name: 🔍 Extrair slugs e tags dos posts
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'fs';
          const raw = readFileSync('src/data/posts.ts', 'utf-8');

          const slugMatches    = [...raw.matchAll(/slug:\s*"([^"]+)"/g)];
          const titleMatches   = [...raw.matchAll(/title:\s*"([^"]+)"/g)];
          const tagsMatches    = [...raw.matchAll(/tags:\s*\[([^\]]+)\]/g)];
          const categoryMatches = [...raw.matchAll(/category:\s*"([^"]+)"/g)];

          const posts = slugMatches.map((m, i) => ({
            slug:     m[1],
            title:    titleMatches[i]?.[1]   || m[1],
            category: categoryMatches[i]?.[1] || '',
            tags: (tagsMatches[i]?.[1] || '')
              .split(',')
              .map(t => t.trim().replace(/["']/g, ''))
              .filter(Boolean)
              .slice(0, 3),
          }));

          writeFileSync('/tmp/posts-meta.json', JSON.stringify(posts, null, 2));
          console.log(`✅ ${posts.length} posts encontrados`);
          posts.forEach(p => console.log(` - ${p.slug}`));
          EOF

      - name: 🤖🔍 Gerar queries (OpenRouter) + Buscar imagens (Unsplash)
        env:
          UNSPLASH_API_KEY:   ${{ secrets.UNSPLASH_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_ALL:          ${{ github.event.inputs.force_all || 'false' }}
          SPECIFIC_SLUG:      ${{ github.event.inputs.specific_slug || '' }}
        run: node .github/scripts/fetch-unsplash-images.mjs

      - name: 📊 Verificar imagens geradas
        run: |
          echo "=== Imagens em public/images/posts/ ==="
          ls -lah public/images/posts/ 2>/dev/null || echo "Nenhuma imagem encontrada"
          echo "Total: $(ls public/images/posts/ 2>/dev/null | wc -l) imagens"

      - name: 💾 Commit e push das imagens geradas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update blog post images [skip ci]"
          file_pattern: "public/images/posts/*.jpg public/images/posts/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
